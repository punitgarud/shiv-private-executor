plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.shiv.executor'
    compileSdk 34
    defaultConfig {
        applicationId "com.shiv.executor"
        minSdk 26
        targetSdk 34
        versionCode 105
        versionName "4.0-REAL"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Seeker MWA - official version for Seeker dApps
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib:2.0.8'
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.8'
}
