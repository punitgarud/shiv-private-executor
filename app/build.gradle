plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
    id 'kotlin-kapt'
}

android {
    namespace 'com.shiv.executor'
    compileSdk 35
    defaultConfig {
        applicationId "com.shiv.executor"
        minSdk 26
        targetSdk 35
        versionCode 105
        versionName "4.0-REAL"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ROOM - correct for kotlin 2.1.21
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // COROUTINES - 1.8.1 for kotlin 2.1.21
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'

    // SOLANA MOBILE - OFFICIAL SEEKER COORDINATES
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib:2.0.8'
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.8'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
