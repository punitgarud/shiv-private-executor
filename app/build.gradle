plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shiv.executor'
    compileSdk 34
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.shiv.executor"
        minSdk 26
        targetSdk 34
        versionCode 105
        versionName "4.0-REAL"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib:2.0.4'
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.4'
}
